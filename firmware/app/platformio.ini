; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_port = /dev/cu.usbserial-1440
monitor_speed = 115200
upload_port = /dev/cu.usbserial-1440
upload_speed = 115200
build_flags =
  -DAIPOOL_HOSTNAME=\"aipool\"
  ; Build-time WiFi defaults (secrets stay OUT of git — pass via env):
  ;   AIPOOL_WIFI_SSID=MyNet AIPOOL_WIFI_PASS=secret pio run -t upload
  ; Unset vars expand to "" and the QR-scan/AP fallback path is used.
  -DAIPOOL_WIFI_SSID=\"${sysenv.AIPOOL_WIFI_SSID}\"
  -DAIPOOL_WIFI_PASS=\"${sysenv.AIPOOL_WIFI_PASS}\"
; NOTE: QR decode uses the shared lib (src/qrscan.c + include/qrscan.h over
; src/quirc/ + src/openmv/, MIT via ESP32QRCodeReader), symlinked into this
; src/ like the other shared drivers. No external QR library — decode runs
; on our frames.
